<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aly Express 🚂</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{--cw:min(21vw,104px);font-family:"Fredoka","Segoe UI",system-ui,sans-serif;color:#4a1f33;overflow:hidden;background-color:#ffb3cf;
background-image:radial-gradient(#ff8fb7 4px,transparent 4.5px),radial-gradient(rgba(255,255,255,.65) 2.5px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.2) 50%,transparent 50%);
background-size:40px 40px,24px 24px,60px 60px;background-position:0 0,12px 12px,0 0;animation:drift 16s linear infinite}
@keyframes drift{to{background-position:120px 120px,132px 132px,120px 0}}
.pg{position:fixed;inset:0}
.fl{position:fixed;font-size:26px;pointer-events:none;z-index:1;animation:pop 4.5s ease-out forwards}
@keyframes pop{0%{transform:scale(0)}12%{transform:scale(1.5)}25%{transform:scale(1)}100%{transform:translateY(-130px) rotate(35deg);opacity:0}}
/* page 1 */
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;text-align:center;padding:0 14px;z-index:4;transition:opacity .5s}
h1{font-weight:700;font-size:clamp(30px,8.5vw,52px);line-height:1.1;margin:0;color:#fff;text-shadow:0 3px 0 #e0306a,0 0 14px rgba(224,48,106,.55)}
.top p{margin:6px auto 0;max-width:520px;font-weight:500;font-size:clamp(14px,3.8vw,19px);color:#7a1d45}
.cut{position:absolute;bottom:0;height:70vh;display:flex;justify-content:center;align-items:flex-end;z-index:2}
.cut img{height:100%;width:auto;max-width:none;display:block}
.fb{display:none;font-size:30vh}
.l{left:-2vw;transform:translateY(110%);animation:up .8s .8s cubic-bezier(.2,1.5,.4,1) forwards}
.r{right:-14vw;transform:translateY(110%);animation:up .8s .2s cubic-bezier(.2,1.5,.4,1) forwards}
.m{left:50%;z-index:3;transform:translate(-50%,110%);animation:upm .8s 1.4s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes up{to{transform:translateY(0)}}
@keyframes upm{to{transform:translate(-50%,0)}}
@keyframes dn{from{transform:translateY(0)}to{transform:translateY(120%)}}
@keyframes dnm{from{transform:translate(-50%,0)}to{transform:translate(-50%,120%)}}
.out .top{opacity:0}.out .l,.out .r{animation:dn .7s forwards}.out .m{animation:dnm .7s forwards}
.hatb{--hw:min(30vw,125px);position:absolute;left:56%;width:var(--hw);top:calc(70vh * .08 - var(--hw) * 1.1);background:none;border:0;padding:0;cursor:pointer;animation:beat 1s ease-in-out infinite;z-index:5;opacity:0;animation-delay:2.2s;animation-fill-mode:backwards}
.hatb svg{width:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.hatb em{position:absolute;left:100%;top:25%;white-space:nowrap;background:#fff;color:#e0306a;border-radius:999px;padding:4px 12px;font:700 15px "Fredoka",sans-serif;box-shadow:0 4px 10px rgba(224,48,106,.4)}
@keyframes beat{0%,100%{opacity:1;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.3)}}
/* heads and girl */
.head{position:relative;width:1em;height:1em}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#ffd6e4;border:.04em solid #fff;display:grid;place-items:center}
.face span{font-size:.6em}.face img{position:absolute}
.head svg{position:absolute;width:.9em;left:50%;margin-left:-.45em;top:-.78em;transform:rotate(-10deg);pointer-events:none}
.fly{position:fixed;z-index:30;transform-origin:0 0;transition:left .9s cubic-bezier(.5,0,.7,1.3),top .9s cubic-bezier(.5,0,.7,1.3),transform .9s}
.girl{position:absolute;bottom:14px;left:50%;margin-left:-30px;width:60px;height:80px}
.girl svg{width:100%;height:100%}
.gslot{position:absolute;left:50%;top:-40px;width:56px;height:56px;margin-left:-28px}
.gslot .head{opacity:0}.gslot .head.on{opacity:1;animation:land .4s}
@keyframes land{50%{transform:translateY(5px) scale(1.1)}}
/* train */
.rail{position:fixed;left:0;right:0;bottom:8px;height:6px;background:repeating-linear-gradient(90deg,#c2336b 0 14px,transparent 14px 22px);z-index:3}
#train{position:fixed;left:0;bottom:12px;display:flex;align-items:flex-end;gap:8px;z-index:5;transform:translateX(var(--x,-200vw));transition:transform 1.8s ease-in-out}
#train.chug{animation:chug .25s infinite}
@keyframes chug{0%,100%{transform:translateX(var(--x))}50%{transform:translateX(var(--x)) translateY(-3px)}}
.cart{position:relative;width:var(--cw);height:calc(var(--cw)*.62);flex:none}
.cart::after{content:"";position:absolute;right:-9px;bottom:20px;width:9px;height:4px;background:#c2336b}
.bx{position:absolute;left:0;right:0;bottom:12px;height:70%;background:linear-gradient(#ff8fb8,#ff5c93);border:3px solid #fff;border-radius:6px 6px 12px 12px;box-shadow:0 4px 8px rgba(224,48,106,.4);color:#fff;font-weight:700;text-align:center;line-height:calc(var(--cw)*.4)}
.load{position:absolute;left:0;right:0;bottom:calc(12px + 70%);text-align:center;font-size:calc(var(--cw)*.42);line-height:1}
.w{position:absolute;bottom:0;width:calc(var(--cw)*.16);aspect-ratio:1;border-radius:50%;background:#4a1f33;border:3px solid #fff}
.loco{position:relative;width:calc(var(--cw)*1.15);height:calc(var(--cw)*.9);flex:none}
.loco .bd{position:absolute;left:0;right:0;bottom:12px;height:42%;background:#ff5c93;border:3px solid #fff;border-radius:6px 18px 8px 8px}
.loco .cab{position:absolute;left:0;bottom:calc(12px + 38%);width:42%;height:48%;background:#ff8fb8;border:3px solid #fff;border-radius:8px 8px 0 0}
.loco .ch{position:absolute;right:16%;bottom:calc(12px + 40%);width:16%;height:30%;background:#c2336b;border-radius:3px 3px 0 0}
.want{outline:4px dashed #ff4d85;outline-offset:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-offset:11px}}
.hot{transform:scale(1.06)}
/* pages 2-4 */
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;opacity:0;pointer-events:none;transition:opacity .6s;z-index:4}
#ui.on{opacity:1;pointer-events:auto}
.dcard{width:min(94vw,500px);background:rgba(255,255,255,.75);border-radius:22px;padding:14px 18px;font-weight:500;font-size:clamp(14px,3.9vw,17px);line-height:1.45;text-align:center;box-shadow:0 10px 30px rgba(224,48,106,.3)}
.hint{font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(224,48,106,.7);margin:16px 0 8px}
.tray{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.box{width:84px;height:84px;border-radius:18px;background:#fff;box-shadow:0 8px 18px rgba(224,48,106,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:10;text-align:center;padding:4px}
.box span{font-size:32px;line-height:1.1}.box small{font-size:11px;font-weight:700;line-height:1.1}
.box.lift{cursor:grabbing;z-index:50}
#bub{position:fixed;right:8px;bottom:calc(var(--cw)*.62 + 140px);width:min(80vw,330px);background:#fff;border-radius:18px;padding:12px 16px;font-weight:600;line-height:1.4;box-shadow:0 8px 20px rgba(224,48,106,.35);z-index:20;opacity:0;transition:opacity .4s}
#bub.on{opacity:1}
#bub::after{content:"";position:absolute;bottom:-9px;right:36px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.puff{position:fixed;border-radius:50%;background:rgba(255,255,255,.92);pointer-events:none;z-index:40;animation:pf 2.4s ease-out forwards}
@keyframes pf{from{transform:scale(.3);opacity:.95}to{transform:translate(var(--dx),var(--dy)) scale(var(--sc));opacity:0}}
#smoke{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;transition:opacity .9s;background:radial-gradient(circle at 85% 90%,#fff 0,#ffe8f0 40%,#ffc2d6 100%)}
/* page 5 */
#p5{display:none;z-index:6}#p5.on{display:block}
.gr{position:absolute;left:0;right:0;bottom:0;height:64px;background:#ff8fb8;border-top:6px solid #fff}
.cap{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:0;right:0;text-align:center;font-weight:700;font-size:clamp(20px,6vw,30px);color:#fff;text-shadow:0 3px 0 #e0306a}
.sc{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
.sc.on{display:flex;animation:fi .6s}
@keyframes fi{from{opacity:0;transform:translateX(40px)}}
.nw{font-weight:700;color:#7a1d45;letter-spacing:2px;margin-bottom:10px;text-align:center}
.screen{width:min(88vw,560px);height:36vh;background:#1a0d18;border:10px solid #c2336b;border-radius:12px;box-shadow:0 0 0 6px #ff8fb8,0 0 60px rgba(255,255,255,.7);display:grid;place-items:center;text-align:center;padding:12px}
.screen b{color:#fff;font-size:clamp(24px,8vw,48px);line-height:1.15}
.pop{font-size:40px;margin-top:14px}
.sign{background:#fff;border-radius:999px;padding:10px 24px;font-weight:700;font-size:clamp(20px,6.5vw,34px);box-shadow:0 8px 20px rgba(224,48,106,.4);text-align:center}
.table{margin-top:30px;width:min(86vw,480px);height:96px;background:#fff5ea;border-radius:16px;border-bottom:12px solid #c98a5a;display:flex;justify-content:space-around;align-items:center;font-size:34px}
.pgirl{position:absolute;left:24vw;bottom:58px;margin-left:-30px;width:60px;height:80px;transform:scale(1.9);transform-origin:50% 100%;z-index:3}
.pgirl svg{width:100%;height:100%}
.man{position:absolute;right:8vw;bottom:62px;width:min(34vw,160px)}
#nx{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font:700 17px "Fredoka",sans-serif;border:0;border-radius:999px;padding:11px 26px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff4d85,#ff7aa5);box-shadow:0 8px 20px rgba(255,77,133,.5);z-index:5;white-space:nowrap}
.sent{position:absolute;bottom:68px;left:0;right:0;text-align:center;font-weight:700;color:#7a1d45;z-index:5}
canvas{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<section class="pg" id="p1"><div class="top"><h1 id="ttl"></h1><p>Are you curious how far she can go? Come along Aly Express! CHOO CHOO! 🚂</p></div></section>
<div id="ui"><div class="dcard" id="dc"></div><p class="hint" id="hint"></p><div class="tray" id="tray"></div></div>
<div class="rail"></div>
<div id="train"></div>
<div id="bub"></div>
<div id="smoke"></div>
<section class="pg" id="p5"><div class="cap" id="cap"></div><div class="gr"></div><button id="nx"></button><div class="sent" id="sent"></div></section>

<script>
// ✏️ EDIT THESE
const CONFIG = {
  title: "Aly’s 20th Birthday",
  photos: ["aly1.png", "aly2.png", "aly3.png"],   // left, middle (gets the hat), right: transparent PNG cutouts
  hat: { left: "56%", top: "" },                  // hat spot on the middle photo (top: "" = automatic)
  face: { zoom: 2.2, left: -0.73, top: -0.06 },    // crop of the middle photo used for mini Aly’s face
  stops: [
    { desc: "Before we get to see Aly’s destination, we need to relax first and prepare for the journey ahead. Pick a movie to watch for us to gain knowledge and experience on the journey ahead.",
      hint: "Drag a movie into the 2nd cart 👇", cart: 2,
      items: [{e:"🎹",l:"La La Land",c:"#ffe3b3"},{e:"🐉",l:"Spirited Away",c:"#c9f0e0"},{e:"🎈",l:"Up",c:"#cfe6ff"}],
      line: "782. (Aly Arididon) aanhin ang seven wonders of the world kung ndi ikaw c aly" },
    { desc: "Next we have to replenish our strength and mind WITH GOOD FOOD. Pick among the food choices.",
      hint: "Drag your food into the 3rd cart 👇", cart: 3,
      items: [{e:"🍜",l:"Nanyang",c:"#fff0c9"},{e:"🍲",l:"Borro",c:"#ffd9c9"},{e:"🍢",l:"Tori-tori",c:"#ffd1d1"},{e:"🍛",l:"Purple Rice",c:"#e6d6ff"}],
      line: "im thinking ab u as often as i think ab my dino sandwich" },
    { desc: "One more stop before the destination… it’s time for the grand surprise!",
      hint: "Drag the surprise into the 4th cart 👇", cart: 4,
      items: [{e:"🎁",l:"Grand Surprise",c:"#ffe0ee"}],
      line: "My favorite things in life are like that choco ice cream, but ure the chocolate at the end of the cone" }
  ]
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const HAT = '<svg viewBox="0 0 100 110"><polygon points="50,10 10,102 90,102" fill="#ffd24d" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><polygon points="50,10 33,50 67,50" fill="#ff4d85"/><circle cx="40" cy="78" r="5" fill="#ff4d85"/><circle cx="62" cy="84" r="5" fill="#7ad7ff"/><circle cx="50" cy="66" r="4" fill="#b28cff"/><circle cx="50" cy="9" r="9" fill="#fff"/></svg>';
const BODY = '<svg viewBox="0 0 60 80"><path d="M22 28L8 46M38 28L52 46" stroke="#ffd9b8" stroke-width="5" stroke-linecap="round"/><path d="M30 14L13 60H47Z" fill="#ff7aa9" stroke="#fff" stroke-width="2"/><path d="M24 60V74M36 60V74" stroke="#ffd9b8" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="76" r="4" fill="#4a1f33"/><circle cx="36" cy="76" r="4" fill="#4a1f33"/></svg>';
const picks = [];

function head(fs){
  const h = document.createElement("div"); h.className = "head"; h.style.fontSize = fs + "px";
  const f = CONFIG.face;
  h.innerHTML = '<div class="face"><span>🙂</span><img alt="" src="' + CONFIG.photos[1] + '" onerror="this.remove()" style="width:' + f.zoom + 'em;left:' + f.left + 'em;top:' + f.top + 'em"></div>' + HAT;
  return h;
}

// page 1: photos pop up from the bottom (right, left, then middle)
$("ttl").textContent = CONFIG.title;
[["l",0],["m",1],["r",2]].forEach(([c, i]) => {
  const d = document.createElement("div"); d.className = "cut " + c;
  d.innerHTML = '<img alt="Aly" src="' + CONFIG.photos[i] + '" ><span class="fb">💁‍♀️</span>';
  d.firstChild.onerror = function(){ this.remove(); d.querySelector(".fb").style.display = "block"; };
  if (c === "m") d.insertAdjacentHTML("beforeend", '<button class="hatb" id="hat" style="left:' + CONFIG.hat.left + (CONFIG.hat.top ? ";top:" + CONFIG.hat.top : "") + '">' + HAT + '<em>Click me!</em></button>');
  $("p1").appendChild(d);
});

// build the train: cart 4, 3, 2, 1 (Aly), engine
const train = $("train");
let tr = "";
for (let i = 4; i >= 1; i--) tr += '<div class="cart" id="c' + i + '"><div class="bx">' + (i > 1 ? i : "") + '</div><div class="load" id="ld' + i + '"></div><i class="w" style="left:12%"></i><i class="w" style="right:12%"></i></div>';
tr += '<div class="loco"><div class="cab"></div><div class="ch"></div><div class="bd"></div><i class="w" style="left:6%"></i><i class="w" style="left:42%"></i><i class="w" style="right:6%"></i></div>';
train.innerHTML = tr;
const girl = document.createElement("div"); girl.className = "girl"; girl.innerHTML = BODY + '<div class="gslot"></div>';
$("c1").prepend(girl);
const ghead = head(56); girl.querySelector(".gslot").appendChild(ghead);
const xs = () => { const c = $("c1"), e = c.offsetLeft + c.offsetWidth; return { mid: innerWidth/2 - (c.offsetLeft + c.offsetWidth/2), end: innerWidth - 8 - e }; };
const setX = v => train.style.setProperty("--x", v + "px");
setX(-(train.offsetWidth + 40));

// click the hat -> train arrives, head drops on the body, train rolls to page 2
$("hat").onclick = async () => {
  const hb = $("hat"), r = hb.getBoundingClientRect();
  const fh = head(120); fh.classList.add("fly");
  fh.style.left = (r.left + r.width/2 - 60) + "px"; fh.style.top = (r.bottom - 25) + "px";
  document.body.appendChild(fh); hb.style.display = "none";
  $("p1").classList.add("out");
  await sleep(600);
  setX(xs().mid); await sleep(1950);
  const s = girl.querySelector(".gslot").getBoundingClientRect();
  fh.style.left = (s.left + s.width/2 - 28) + "px"; fh.style.top = (s.top + s.height/2 - 28 - 7) + "px"; fh.style.transform = "scale(" + (56/120) + ")";
  await sleep(1000);
  ghead.classList.add("on"); fh.remove(); await sleep(500);
  setX(xs().end); $("p1").style.display = "none";
  await sleep(1700);
  stage(0);
};

// drag helpers
function hit(b, t){
  const a = b.getBoundingClientRect(), r = t.getBoundingClientRect(), m = 24, x = a.left + a.width/2, y = a.top + a.height/2;
  return x > r.left - m && x < r.right + m && y > r.top - m && y < r.bottom + m;
}
function dragBoxes(items, target, onHit){
  const tray = $("tray"); tray.innerHTML = ""; target.classList.add("want");
  items.forEach(it => {
    const b = document.createElement("div"); b.className = "box"; b.style.background = it.c;
    b.innerHTML = "<span>" + it.e + "</span><small>" + it.l + "</small>";
    let sx, sy, on = false;
    b.onpointerdown = e => { on = true; sx = e.clientX; sy = e.clientY; b.setPointerCapture(e.pointerId); b.style.transition = "none"; b.classList.add("lift"); };
    b.onpointermove = e => { if (!on) return; b.style.transform = "translate(" + (e.clientX - sx) + "px," + (e.clientY - sy) + "px) scale(1.1)"; target.classList.toggle("hot", hit(b, target)); };
    b.onpointerup = () => {
      if (!on) return; on = false; b.classList.remove("lift"); target.classList.remove("hot");
      if (hit(b, target)) { target.classList.remove("want"); tray.innerHTML = ""; onHit(it); }
      else { b.style.transition = "transform .3s"; b.style.transform = ""; }
    };
    tray.appendChild(b);
  });
}

// pages 2-4
function stage(i){
  const s = CONFIG.stops[i];
  $("dc").textContent = s.desc; $("hint").textContent = s.hint; $("ui").classList.add("on");
  dragBoxes(s.items, $("c" + s.cart), it => {
    picks[i] = it; $("ld" + s.cart).textContent = it.e; $("hint").textContent = "";
    leave(s.line, () => { if (i < 2) stage(i + 1); else scenes(); });
  });
}
function puff(){
  const e = document.createElement("div"), z = 36 + Math.random() * 30;
  e.className = "puff"; e.style.width = e.style.height = z + "px";
  e.style.left = (innerWidth - 20 - Math.random() * 30) + "px"; e.style.top = (innerHeight * .7 + Math.random() * 40) + "px";
  e.style.setProperty("--dx", -(80 + Math.random() * 220) + "px"); e.style.setProperty("--dy", -(60 + Math.random() * 120) + "px"); e.style.setProperty("--sc", 3 + Math.random() * 3);
  document.body.appendChild(e); setTimeout(() => e.remove(), 2400);
}
async function leave(line, next){
  $("ui").classList.remove("on"); $("bub").textContent = line; $("bub").classList.add("on");
  train.classList.add("chug"); const iv = setInterval(puff, 200);
  await sleep(3800);
  $("smoke").style.opacity = 1; await sleep(1000);
  $("bub").classList.remove("on"); train.classList.remove("chug"); clearInterval(iv);
  next(); await sleep(250); $("smoke").style.opacity = 0;
}

// page 5: arrival scenes
function scenes(){
  const m = picks[0], f = picks[1];
  train.style.display = "none"; $("ui").style.display = "none"; document.querySelector(".rail").style.display = "none";
  const S = [
    { cap: "Stop 1 · Movie night 🎬", h: '<div class="nw">NOW SHOWING</div><div class="screen"><b>' + m.l + '</b></div><div class="pop">🍿 🥤 🍫</div>' },
    { cap: "Stop 2 · Dinner 🍽️", h: '<div class="sign">' + f.e + " " + f.l + '</div><div class="table"><span>🕯️</span><span>' + f.e + '</span><span>🌹</span><span>' + f.e + '</span><span>🕯️</span></div>' },
    { cap: "Final stop · Grand surprise 🎁", h: '<div class="nw">Someone is waiting for you…</div><svg class="man" viewBox="0 0 110 200"><g fill="rgba(255,255,255,.2)" stroke="#fff" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"><circle cx="50" cy="30" r="22"/><path d="M20 190V90Q20 60 50 60Q80 60 80 90V190Z"/><path d="M80 80L98 118" fill="none"/></g><text x="50" y="135" font-size="70" font-weight="700" fill="#fff" text-anchor="middle">?</text><text x="84" y="146" font-size="34">🎁</text></svg>' }
  ];
  S.forEach((s, i) => { const d = document.createElement("div"); d.className = "sc"; d.id = "sc" + i; d.innerHTML = s.h; $("p5").prepend(d); });
  const g = document.createElement("div"); g.className = "pgirl"; g.innerHTML = BODY + '<div class="gslot"></div>'; g.querySelector(".gslot").appendChild(head(56)); g.querySelector(".head").style.opacity = 1;
  $("p5").appendChild(g); $("p5").classList.add("on");
  const show = k => {
    S.forEach((_, j) => $("sc" + j).classList.toggle("on", j === k)); $("cap").textContent = S[k].cap;
    $("nx").textContent = k < 2 ? "Next stop 🚉" : "Send my answer 💌";
    $("nx").onclick = k < 2 ? () => show(k + 1) : send; if (k === 2) confetti();
  };
  show(0);
}
async function send(){
  const text = "Aly Express ✅ I picked " + picks[0].l + " 🎬 + " + picks[1].l + " 🍽️ and I’m ready for the grand surprise 🎁 — Aly";
  try { if (navigator.share) { await navigator.share({ text }); $("sent").textContent = "Sent! 💌"; return; } } catch (e) {}
  try { await navigator.clipboard.writeText(text); $("sent").textContent = "Copied! Paste it in a message 💌"; } catch (e) { $("sent").textContent = "Screenshot this and send it 💌"; }
}

// hearts, ribbons and pink flowers popping on the sides
setInterval(() => {
  const e = document.createElement("div"); e.className = "fl";
  e.textContent = ["💗","🎀","🌸","🌷","🌺","💖","🌸","🎀"][Math.floor(Math.random() * 8)];
  e.style.left = (Math.random() < .5 ? Math.random() * 12 : 88 + Math.random() * 9) + "vw"; e.style.top = (8 + Math.random() * 72) + "vh";
  document.body.appendChild(e); setTimeout(() => e.remove(), 4600);
}, 420);

function confetti(){
  const c = $("fx"), ctx = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#ff4d85","#ffb3cc","#ffd24d","#7ad7ff","#b28cff"];
  const ps = Array.from({length:140}, () => ({ x: innerWidth/2, y: innerHeight/2, vx: (Math.random()-.5)*16, vy: Math.random()*-14-2, s: 5+Math.random()*6, c: cols[Math.floor(Math.random()*5)], r: Math.random()*6 }));
  let f = 0;
  (function tick(){
    ctx.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.r += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*.6); ctx.restore(); });
    if (++f < 140) requestAnimationFrame(tick); else ctx.clearRect(0, 0, c.width, c.height);
  })();
}
