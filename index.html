<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aly Express 🚂</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<!-- html2canvas for generating instant screenshot image download of the summary card -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{--cw:min(17.5vw,24vh);--sb:calc(var(--cw) + 40px);--hw:min(38vw,26vh);font-family:"Fredoka","Segoe UI",system-ui,sans-serif;color:#4a1f33;overflow:hidden;-webkit-user-select:none;user-select:none;background-color:#ffb3cf;
background-image:radial-gradient(#ff8fb7 4px,transparent 4.5px),radial-gradient(rgba(255,255,255,.65) 2.5px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.2) 50%,transparent 50%);
background-size:40px 40px,24px 24px,60px 60px;background-position:0 0,12px 12px,0 0;animation:drift 16s linear infinite}
@keyframes drift{to{background-position:120px 120px,132px 132px,120px 0}}
.pg{position:fixed;inset:0}
.fl{position:fixed;font-size:26px;pointer-events:none;z-index:1;animation:pop 4.5s ease-out forwards}
.fl.rise{animation:rise 5s linear forwards;z-index:4;font-size:30px}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}10%{transform:translateY(-6vh) scale(1);opacity:1}62%{opacity:1}100%{transform:translateY(-58vh) rotate(25deg);opacity:0}}
@keyframes pop{0%{transform:scale(0)}12%{transform:scale(1.5)}25%{transform:scale(1)}100%{transform:translateY(-130px) rotate(35deg);opacity:0}}

/* page 1 */
.cake{position:absolute;top:calc(env(safe-area-inset-top,0px) + 72px);width:clamp(52px,13vw,120px);z-index:5;transition:opacity .5s;animation:sway 2.4s ease-in-out infinite alternate}
.cake svg{width:100%;display:block;filter:drop-shadow(0 4px 6px rgba(224,48,106,.4))}
@keyframes sway{from{transform:rotate(-8deg)}to{transform:rotate(8deg) scale(1.06)}}
.top{--s:calc(clamp(6px,7vw,150px) + clamp(52px,13vw,120px) + 8px);position:absolute;top:calc(env(safe-area-inset-top,0px) + 72px);left:0;right:0;text-align:center;padding:0 var(--s);z-index:4;transition:opacity .5s}
@media(min-width:760px){.top{top:calc(env(safe-area-inset-top,0px) + 14px)}}
h1{font-weight:700;font-size:clamp(26px,7.6vw,54px);line-height:1.1;margin:0;color:#fff;text-shadow:0 3px 0 #e0306a,0 0 14px rgba(224,48,106,.55)}
.top p{margin:6px auto 0;max-width:520px;font-weight:500;font-size:clamp(12px,3.4vw,19px);color:#7a1d45}
.cut{position:absolute;top:var(--ty);width:calc(var(--hw) / var(--fw));height:calc(var(--hw) / var(--fw) / var(--a));left:calc(50% + var(--sx) * min(var(--hw) * 1.08 + 96px, 42vw) - var(--fx) * var(--hw) / var(--fw));display:flex;justify-content:center;align-items:flex-start;z-index:2;transform:translateY(120%)}
.cut img{width:100%;height:100%;display:block}
.fb{display:none;font-size:20vh}
.l{--a:.35;--fx:.596;--fw:.592;--sx:-1;--ty:42vh;animation:up .8s .8s cubic-bezier(.2,1.3,.4,1) forwards}
.r{--a:.745;--fx:.561;--fw:.274;--sx:1;--ty:42vh;animation:up .8s .2s cubic-bezier(.2,1.3,.4,1) forwards}
.m{--a:.726;--fx:.558;--fw:.38;--sx:0;--ty:38vh;z-index:3;animation:up .8s 1.4s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes up{to{transform:translateY(0)}}
@keyframes dn{from{transform:translateY(0)}to{transform:translateY(120%)}}
.out .top{opacity:0}.out .cut{animation:dn .7s forwards}.out .cake{opacity:0}
.hatb{--hatw:min(calc(var(--hw) * .8),150px);position:absolute;left:55.8%;width:var(--hatw);top:calc(var(--hw) / var(--fw) / var(--a) * .105 - var(--hatw) * 1.1);background:none;border:0;padding:0;cursor:pointer;animation:beat 1s ease-in-out infinite;z-index:5;opacity:0;animation-delay:2.2s;animation-fill-mode:backwards}
.hatb svg{width:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.hatb em{position:absolute;left:100%;top:25%;white-space:nowrap;background:#fff;color:#e0306a;border-radius:999px;padding:4px 12px;font:700 15px "Fredoka",sans-serif;box-shadow:0 4px 10px rgba(224,48,106,.4)}
@keyframes beat{0%,100%{opacity:1;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.14)}}

/* heads */
.head{position:relative;width:1em;height:1em}
.face{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#ffd6e4;border:.04em solid #fff;display:grid;place-items:center}
.face span{font-size:.6em}.face img{position:absolute}
.head svg{position:absolute;width:.9em;left:50%;margin-left:-.45em;top:-.78em;transform:rotate(-10deg);pointer-events:none}
.fly{position:fixed;z-index:30;transform-origin:0 0;transition:left .9s cubic-bezier(.5,0,.7,1.3),top .9s cubic-bezier(.5,0,.7,1.3),transform .9s}

/* train & drag indicator bubble */
.rail{position:fixed;left:0;bottom:8px;height:6px;width:0;transition:width 2.4s linear;background:repeating-linear-gradient(90deg,#c2336b 0 14px,transparent 14px 22px);z-index:3}
.rail.on{width:100%}
#train{position:fixed;left:0;right:0;bottom:12px;display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:0 8px;z-index:2;transform:translateX(var(--x,-130vw)) scale(var(--sc,1));transform-origin:100% 100%;transition:transform 1.9s ease-out}
#train.chug{animation:chug .22s infinite}
@keyframes chug{0%,100%{transform:translateX(var(--x)) scale(var(--sc,1))}50%{transform:translateX(var(--x)) scale(var(--sc,1)) translateY(-3px)}}
.cart{position:relative;width:calc(var(--cw)*1.25);height:calc(var(--cw)*.66);flex:none}
.cart::after{content:"";position:absolute;right:-8px;bottom:20px;width:8px;height:4px;background:#c2336b}
.bx{position:absolute;left:0;right:0;bottom:12px;height:70%;background:linear-gradient(#ff8fb8,#ff5c93);border:3px solid #fff;border-radius:6px 6px 12px 12px;box-shadow:0 4px 8px rgba(224,48,106,.4);color:#fff;font-weight:700;text-align:center;line-height:calc(var(--cw)*.44);font-size:calc(var(--cw)*.22)}
.load{position:absolute;left:0;right:0;bottom:calc(12px + 70%);text-align:center;font-size:calc(var(--cw)*.46);line-height:1}
.w{position:absolute;bottom:0;width:calc(var(--cw)*.17);aspect-ratio:1;border-radius:50%;background:#4a1f33;border:3px solid #fff}
.loco{position:relative;width:calc(var(--cw)*1.45);height:var(--cw);flex:none}
.loco .bd{position:absolute;left:0;right:0;bottom:12px;height:52%;background:#ff5c93;border:3px solid #fff;border-radius:6px 30px 8px 8px}
.loco .cab{position:absolute;left:0;bottom:12px;width:36%;height:84%;background:#ff8fb8;border:3px solid #fff;border-radius:8px 8px 0 0}
.loco .ch{position:absolute;left:50%;bottom:calc(12px + 50%);width:12%;height:24%;background:#c2336b;border-radius:3px 3px 0 0}
.gs{position:absolute;right:2%;bottom:calc(12px + 3%)}
.gs .head{opacity:0}.gs .head.on{opacity:1;animation:land .4s}
@keyframes land{50%{transform:translateY(5px) scale(1.1)}}

/* Drag options bubble attachment on Aly's train head */
.drag-prompt-bub{position:absolute;left:50%;bottom:108%;transform:translateX(-50%);background:#fff;color:#e0306a;border:2px solid #ff5c93;border-radius:12px;padding:3px 8px;font-size:clamp(9px,2.2vw,12px);font-weight:700;white-space:nowrap;box-shadow:0 4px 10px rgba(224,48,106,.35);pointer-events:none;z-index:10;display:none;animation:bounceProm 1.2s ease-in-out infinite}
.drag-prompt-bub.show{display:block}
.drag-prompt-bub::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border-width:7px 6px 0;border-style:solid;border-color:#fff transparent;display:block;width:0}
@keyframes bounceProm{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}

.want{outline:4px dashed #1e88ff;outline-offset:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-offset:11px}}
.hot{transform:scale(1.04)}
.puff{position:fixed;border-radius:50%;background:rgba(255,255,255,.9);pointer-events:none;z-index:40;animation:pf 2s ease-out forwards}
@keyframes pf{from{transform:scale(.4);opacity:.9}to{transform:translate(var(--dx),var(--dy)) scale(var(--sc));opacity:0}}

/* stop counter */
#stops{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;z-index:8}
.note{font-size:clamp(10px,2.9vw,13px);font-weight:700;color:#7a1d45;text-shadow:0 1px 2px rgba(255,255,255,0.8);white-space:nowrap;margin-bottom:4px}
#row{display:flex;align-items:center}
.st{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:none;transition:background .4s}
.st[data-s=r]{background:#ff4d4d;cursor:not-allowed}.st[data-s=y]{background:#ffd23f}.st[data-s=g]{background:#3ccf6b;cursor:pointer}
.ln{width:16px;height:4px;background:#fff;flex:none}
.st.blink{animation:blink .8s infinite}
@keyframes blink{50%{opacity:.25;transform:scale(1.3)}}
.hr{position:relative;height:18px}
.here{position:absolute;top:3px;font-size:12px;font-weight:700;color:#7a1d45;text-shadow:0 1px 2px rgba(255,255,255,0.8);white-space:nowrap;transition:left .6s}

/* pages 2-4 UI */
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 78px) 8px calc(var(--cw)*1.6 + 22px);z-index:4;transform:translateX(110vw);pointer-events:none;transition:transform 1.5s ease-in-out}
#ui.in{transform:none;pointer-events:auto}#ui.out{transform:translateX(-110vw)}
.dcard{width:min(98vw,680px);background:rgba(255,255,255,.88);border-radius:18px;padding:9px 16px;font-weight:600;font-size:clamp(12px,3.2vw,17px);line-height:1.35;text-align:center;box-shadow:0 10px 30px rgba(224,48,106,.3);color:#7a1d45}
.tray{flex:1;min-height:0;width:min(99vw,1200px);margin-top:8px;display:grid;gap:8px;grid-auto-rows:1fr}
.n6,.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:820px){.n6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.n5{grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;overflow-y:auto;align-content:start;overscroll-behavior:contain}
.n5 .box{overflow:visible;min-height:max-content}
@media(min-width:820px){.n5{grid-template-columns:repeat(3,minmax(0,1fr));align-content:center}}
.n3{grid-template-columns:repeat(3,minmax(0,1fr))}.n1{grid-template-columns:minmax(0,320px);justify-content:center}.n3,.n1{grid-auto-rows:minmax(0,300px);align-content:center}
.box{border-radius:16px;box-shadow:0 8px 18px rgba(224,48,106,.4);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:10;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
.box.big{align-items:center;text-align:center}
.big span{font-size:clamp(40px,12vw,80px);line-height:1.1}.big small{font-size:clamp(12px,3.4vw,18px);font-weight:700}
.box.food{align-items:flex-start;font-size:clamp(11px,3.3vw,17px);line-height:1.3;font-weight:500}
.nm small{font-weight:500;opacity:.85;font-size:.82em}

/* Page 3 movie cards */
.box.mv{cursor:grab;touch-action:none;justify-content:flex-start;font-size:clamp(9.5px,2.2vw,12px);line-height:1.25;font-weight:500;gap:2px;padding:6px 8px}
.mv .top2{display:flex;justify-content:space-between;align-items:center;gap:4px}
.rating-row{margin-top:3px;font-size:.95em;color:#7a1d45}.rating-link{color:#d42a6a;font-weight:700;text-decoration:underline}
.hd{background:#ff5c93;color:#fff;border-radius:999px;padding:2px 7px;font-weight:700;font-size:10px;white-space:nowrap;box-shadow:0 2px 6px rgba(224,48,106,.3);pointer-events:none}
.nm{font-weight:700;font-size:1.05em;margin-bottom:1px;line-height:1.15}
.mn{display:flex;justify-content:space-between;gap:6px;width:100%;margin-top:2px;flex-wrap:wrap}
.mn a{color:#d42a6a;font-weight:700;text-decoration:underline}.ck{font-weight:700;white-space:nowrap}.ck.ok{color:#1f9d55}.ck.no{color:#d42a2a}
.box.gift{background:none!important;box-shadow:none;overflow:visible;align-items:center}
.gift svg{width:min(56vw,230px);filter:drop-shadow(0 10px 12px rgba(224,48,106,.5));animation:bobg 1.4s ease-in-out infinite}
@keyframes bobg{50%{transform:translateY(-6px) rotate(2deg)}}
.box.lift{cursor:grabbing;z-index:60}
#bub{position:fixed;width:min(80vw,330px);background:#fff;border-radius:18px;padding:12px 16px;font-weight:600;line-height:1.4;box-shadow:0 8px 20px rgba(224,48,106,.35);z-index:20;opacity:0;transition:opacity .4s;pointer-events:none}
#bub.on{opacity:1}
#bub::after{content:"";position:absolute;bottom:-16px;right:var(--tr,40px);border:10px solid transparent;border-top:16px solid #fff;border-bottom:0}

/* page 5: the scene setup */
#scene{display:none;position:fixed;inset:0;z-index:3}#scene.on{display:block;animation:fo 1s}
@keyframes fo{from{opacity:0}}

/* Movie set-up on left */
.cin{position:absolute;top:calc(env(safe-area-inset-top,0px) + 145px);left:calc(26% - 10px);transform:translateX(-50%);width:min(72vw,560px)}
.val{position:absolute;top:-16px;left:-2%;right:-2%;height:22px;background:#c2336b;border-radius:12px;box-shadow:0 4px 8px rgba(0,0,0,.2);z-index:2}
.curt{position:absolute;top:0;bottom:-4px;width:10%;background:repeating-linear-gradient(90deg,#c2336b 0 9px,#9d2456 9px 18px);border-radius:0 0 10px 10px;z-index:1}
.curt.l{left:-4%}.curt.r{right:-4%}
.bscreen{position:relative;height:min(26vh,230px);margin:0 5%;background:radial-gradient(ellipse at 50% 40%,#3a2a40,#1a0d18 70%);border:8px solid #2b1a2e;border-radius:10px;box-shadow:0 0 0 5px #ff8fb8,0 0 60px rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;color:#fff}
.bscreen small{letter-spacing:3px;color:#ffb3cf;font-weight:700}.bscreen b{font-size:clamp(16px,4.5vw,34px);line-height:1.1}
.seats{position:absolute;left:8%;bottom:-38px;display:flex;gap:6px;width:30%;z-index:2}.seats svg{width:50%}
.pcorn{position:absolute;right:8%;bottom:-38px;width:11%;min-width:34px;z-index:2}

/* Person holding present positioned in the CENTER */
.guy{position:absolute;left:61%;transform:translateX(-50%);bottom:calc(var(--sb) - 28px);width:min(28vw,160px);z-index:4}
.guy svg{width:100%;display:block;overflow:visible}
.gslot2{position:absolute;left:calc(50% - 39px);top:calc(56px - 72px);width:78px;height:78px;z-index:5}

/* Dinner set-up moved to the RIGHT side */
.dine{position:absolute;right:1%;bottom:calc(var(--sb) - 28px);width:max(250px,min(60vw,500px));aspect-ratio:3/2.2}
.dine>svg{position:relative;width:100%;height:100%;overflow:visible}

/* Selected Restaurant Name directly on the pink table fabric */
.table-resto-label{position:absolute;left:64%;top:63%;transform:translateX(-50%);width:55%;text-align:center;z-index:5;color:#fff;font-weight:700;font-size:clamp(14px,2.8vw,21px);line-height:1.1;text-shadow:0 2px 4px rgba(160,20,60,0.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}

/* Live musicians playing instruments placed FARTHER IN THE BACKGROUND for depth */
.musicians{position:absolute;left:34%;right:auto;bottom:calc(var(--sb) + 85px);width:clamp(120px,28vw,210px);height:80px;pointer-events:none;z-index:1;display:flex;justify-content:space-around;align-items:flex-end;opacity:0.92;transform:scale(0.85)}
.musician-svg{width:46%;height:100%;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.15))}
.musician-svg.jam{animation:jamBeat 1.2s ease-in-out infinite alternate}
.musician-svg.jam2{animation:jamBeat 1.5s ease-in-out infinite alternate-reverse}
@keyframes jamBeat{0%{transform:rotate(-3deg) translateY(0)}100%{transform:rotate(3deg) translateY(-4px)}}

/* Floating music notes coming out of musicians */
.music-notes{position:absolute;inset:0;pointer-events:none}
.m-note{position:absolute;font-size:clamp(14px,3.2vw,22px);animation:floatNote 3s ease-out infinite;opacity:0}
.mn1{left:15%;bottom:60%;animation-delay:0s}
.mn2{left:48%;bottom:70%;animation-delay:1s}
.mn3{left:80%;bottom:65%;animation-delay:1.8s}
@keyframes floatNote{
  0%{opacity:0;transform:translateY(0) scale(0.6) rotate(0deg)}
  20%{opacity:1}
  80%{opacity:0.9}
  100%{opacity:0;transform:translateY(-70px) scale(1.1) rotate(25deg)}
}

/* Aly's head/slot position cleanly resting on top of the body torso */
.wslot{position:absolute;left:calc(76px + 20px - 39px);top:10px;width:78px;height:78px;z-index:5}
.wslot.ready{cursor:pointer;animation:subtleBeat 1.4s ease-in-out infinite}
.wslot em{position:absolute;left:100%;top:10%;white-space:nowrap;background:#fff;color:#e0306a;border-radius:999px;padding:4px 10px;font:700 13px "Fredoka",sans-serif;font-style:normal;box-shadow:0 3px 8px rgba(224,48,106,.3);z-index:6}
@keyframes subtleBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.fx2{position:fixed;font-size:40px;line-height:1;z-index:35;transition:left .9s ease-in-out,top .9s cubic-bezier(.3,-.6,.5,1)}

/* page 6: summary & snapshot */
#end{display:none;position:fixed;inset:0;z-index:3}#end.on{display:block;animation:fo 1s}
.sum{position:absolute;top:calc(env(safe-area-inset-top,0px) + 72px);left:50%;transform:translateX(-50%);width:min(94vw,520px);background:rgba(255,255,255,.94);border-radius:22px;padding:22px 24px;box-shadow:0 12px 34px rgba(224,48,106,.35);font-weight:500;font-size:clamp(14px,3.8vw,18px);line-height:1.5;color:#4a1f33}
.sum h2{margin:0 0 10px;font-size:1.35em;color:#e0306a;text-align:center;border-bottom:2px dashed #ffb3cf;padding-bottom:8px}
.sum p{margin:8px 0}.sum ul{margin:6px 0;padding-left:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;row-gap:3px;align-items:start}.sum li{margin:3px 0}.sum li:nth-child(odd){grid-column:1}.sum li:nth-child(even){grid-column:2}@media(max-width:380px){.sum ul{column-gap:8px;padding-left:20px}}
.sum .ty{font-weight:700;color:#7a1d45;margin-top:16px;text-align:center;font-size:1.05em}
.boarding-pass{margin:9px 0;padding:9px 12px;border:2px solid #ff8fc5;border-radius:16px;background:linear-gradient(135deg,#fffafd,#fff1f7);font-size:.82em;line-height:1.25;box-shadow:0 4px 12px rgba(224,48,106,.08)}
.bp-head{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-bottom:5px;border-bottom:2px dashed #ffb3cf;margin-bottom:6px}
.bp-title{font-weight:700;color:#e0306a;letter-spacing:.3px;font-size:1em;line-height:1.15}
.bp-number{font-size:.85em;color:#66758e;margin-top:2px}
.bp-icon{font-size:1.55em;flex:none}
.bp-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.boarding-pass p{margin:0}.bp-meta b{color:#7a1d45}.bp-status{color:#16804a;font-weight:700}
.back{margin-top:14px;font:700 15px "Fredoka",sans-serif;border:0;border-radius:999px;padding:9px 20px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff4d85,#ff7aa5);box-shadow:0 6px 16px rgba(255,77,133,.45);display:block;margin-left:auto;margin-right:auto}
.buffer{position:absolute;right:0;bottom:12px;width:20px;height:calc(var(--cw)*.8);background:repeating-linear-gradient(135deg,#e53935 0 10px,#fff 10px 20px);border:3px solid #fff;border-radius:6px 0 0 6px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.sign{position:absolute;right:22px;bottom:12px;width:80px;display:flex;flex-direction:column;align-items:center;cursor:pointer;background:none;border:0;padding:0;font-family:inherit}
.sign i{display:grid;place-items:center;width:80px;height:80px;background:#e53935;color:#fff;font:700 18px "Fredoka",sans-serif;font-style:normal;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);box-shadow:inset 0 0 0 5px #fff;transition:transform .2s}
.sign:hover i{transform:scale(1.05)}
.sign span{margin-top:3px;background:#fff;border-radius:999px;font-size:11px;font-weight:700;color:#e53935;padding:3px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.sign s{display:block;width:8px;height:min(calc(var(--cw)*1.6 + 40px),36vh);background:linear-gradient(90deg,#999,#ddd,#999)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- Page 5: Outdoor Cinema & Dinner Scene -->
<div id="scene">

    <div class="seats"><svg viewBox="0 0 60 70"><rect x="8" y="0" width="44" height="42" rx="14" fill="#d4315f" stroke="#fff" stroke-width="3"/><rect x="4" y="36" width="52" height="22" rx="8" fill="#b8244f" stroke="#fff" stroke-width="3"/><rect x="0" y="28" width="10" height="30" rx="5" fill="#9d2456" stroke="#fff" stroke-width="2"/><rect x="50" y="28" width="10" height="30" rx="5" fill="#9d2456" stroke="#fff" stroke-width="2"/><rect x="10" y="58" width="6" height="12" fill="#6d1a3d"/><rect x="44" y="58" width="6" height="12" fill="#6d1a3d"/></svg><svg viewBox="0 0 60 70"><rect x="8" y="0" width="44" height="42" rx="14" fill="#d4315f" stroke="#fff" stroke-width="3"/><rect x="4" y="36" width="52" height="22" rx="8" fill="#b8244f" stroke="#fff" stroke-width="3"/><rect x="0" y="28" width="10" height="30" rx="5" fill="#9d2456" stroke="#fff" stroke-width="2"/><rect x="50" y="28" width="10" height="30" rx="5" fill="#9d2456" stroke="#fff" stroke-width="2"/><rect x="10" y="58" width="6" height="12" fill="#6d1a3d"/><rect x="44" y="58" width="6" height="12" fill="#6d1a3d"/></svg></div>
    <svg class="pcorn" viewBox="0 0 60 80"><g fill="#fff8e1" stroke="#f3d27a" stroke-width="2"><circle cx="16" cy="18" r="9"/><circle cx="30" cy="12" r="10"/><circle cx="44" cy="18" r="9"/><circle cx="23" cy="26" r="9"/><circle cx="38" cy="26" r="9"/></g><path d="M8 30h44l-6 46H14z" fill="#e53935" stroke="#fff" stroke-width="2.5"/><path d="M20 30l2 46M30 30v46M40 30l-2 46" stroke="#fff" stroke-width="5"/></svg>
  </div>

  <!-- Person holding present placed in CENTER -->
  <div class="guy">
    <svg viewBox="0 0 120 200">
      <rect x="38" y="124" width="16" height="64" rx="6" fill="#2b3a55"/>
      <rect x="66" y="124" width="16" height="64" rx="6" fill="#2b3a55"/>
      <ellipse cx="46" cy="190" rx="12" ry="5" fill="#222"/>
      <ellipse cx="74" cy="190" rx="12" ry="5" fill="#222"/>
      <rect x="30" y="56" width="60" height="72" rx="16" fill="#fff" stroke="#cfd8e8" stroke-width="3"/>
      <path d="M48 56L60 72L72 56" fill="#dfe8f5" stroke="#cfd8e8" stroke-width="2"/>
      <path d="M36 70L44 114M84 70L76 114" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
      <g id="pres" opacity="0">

        <path d="M60 94C48 80 40 90 54 94ZM60 94C72 80 80 90 66 94Z" fill="#fff"/>
        <text x="60" y="128" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">?</text>

      <circle cx="42" cy="116" r="6" fill="#ffd9b8"/>
      <circle cx="78" cy="116" r="6" fill="#ffd9b8"/>

  <!-- Dinner set-up moved to RIGHT side without plate, yellow dotted line/circles, or candle -->

        <rect x="264" y="52" width="10" height="82" rx="4" fill="#b9733f"/>
        <rect x="190" y="130" width="76" height="11" rx="5" fill="#b9733f"/>
        <rect x="258" y="141" width="7" height="42" rx="3" fill="#a05f30"/>
        <rect x="194" y="141" width="7" height="42" rx="3" fill="#a05f30"/>
      </g>
      <!-- Girl Body Torso -->
      <rect x="76" y="82" width="40" height="50" rx="14" fill="#ff7aa9" stroke="#fff" stroke-width="2.5"/>
      <path d="M92 98Q112 106 134 112" stroke="#ff7aa9" stroke-width="10" stroke-linecap="round" fill="none"/><circle cx="136" cy="113" r="5" fill="#ffd9b8"/>
      <rect x="76" y="126" width="46" height="13" rx="6" fill="#ffd9b8"/><rect x="114" y="132" width="11" height="44" rx="5" fill="#ffd9b8"/><ellipse cx="124" cy="178" rx="11" ry="5" fill="#4a1f33"/>
      <!-- Table fabric top bar & pink runner cloth -->

      <path d="M134 116H256V155q-10 12-20 0q-10 12-20 0q-10 12-20 0q-10 12-20 0q-10 12-20 0q-10 12-20 0Z" fill="#ff5c93" stroke="#fff" stroke-width="2.5"/>
      <!-- Flower Vase centerpiece -->
      <path d="M190 92L193 106H199L202 92Z" fill="#cfe9ff" stroke="#fff" stroke-width="2"/>
      <path d="M194 92L192 78M198 92L200 76" stroke="#4caf50" stroke-width="2.5" fill="none"/>
      <circle cx="191" cy="74" r="8" fill="#ff8fb8" stroke="#fff" stroke-width="1.5"/><circle cx="202" cy="72" r="7" fill="#ffb3cf" stroke="#fff" stroke-width="1.5"/><circle cx="196" cy="65" r="8" fill="#ff4d85" stroke="#fff" stroke-width="1.5"/><circle cx="196" cy="65" r="2.5" fill="#fff"/>

</div>

<!-- Page 6: Summary and Image Download -->
<div id="end">
  <div class="sum" id="sum"></div>
  <div class="buffer"></div>
  <button class="sign" id="sign"><i>STOP</i><span>⬇ Download</span><s></s></button>
</div>

<div class="rail" id="rail"></div>
<div id="train"></div>
<div id="bub"></div>

<script>
// CONFIG & DATA
const CONFIG = {
  title: "Aly’s 20th Birthday!!!",
  photos: ["aly1.png", "aly2.png", "aly3.png"],   // transparent PNG cutouts
  hat: { left: "55.8%", top: "" },
  face: { zoom: 2.2, left: -0.73, top: -0.06 },
  myPhoto: "clarence (1).jpg",                    // Clarence's photo for the center character
  when: "Oct 24, 11am–8pm",
  stops: [
    { desc: "The journey could get tiring! However, we can combat that with GOOD FOOD. Drag the food you wish to eat onto cart 2 to replenish your strength along the journey.",
      cart: 2, line: "im thinking ab u as often as i think ab my dino sandwich",
      items: [
        {e:"🍜",l:"Nanyang",cu:"Singaporean",u:"http://nanyang.com.ph/menu/",p:"₱200–500",pl:"Opus Mall, Shangri-la",k:1,c:"#fff0c9"},
        {e:"🍢",l:"Tori-tori Kushiyaki",cu:"Japanese, Grill",u:"https://booky.ph/biz/toritori-kushiyaki-snack-bar-katipunan/menu/",p:"₱60 × how many you order",pl:"White Plains",k:0,c:"#ffd1d1"},
        {e:"🍛",l:"Purple Rice",cu:"Thai",u:"https://www.tripadvisor.co.za/Restaurant_Review-g1758900-d26868399-Reviews-Purple_Rice_Bgc-Taguig_City_Metro_Manila_Luzon.html#/media/26868399/784865499:p/?type=ALL_INCLUDING_RESTRICTED&albumid=-184&category=-184",p:"₱500–1000",pl:"Salcedo, BGC",k:1,c:"#e6d6ff"},
        {e:"🌮",l:"Filling Station Bar and Cafe",cu:"American, Mexican",u:"https://sites.google.com/view/fillingstationbarcafemenu/home",p:"₱500–2000",pl:"Poblacion",k:1,c:"#ffe3b3"},
        {e:"🥘",l:"Azadore",cu:"Fusion of Spanish & American",u:"https://www.azadore.com/azadore-menu/",p:"₱500–2000",pl:"Kamuning (near Borro)",k:1,c:"#ffd6e8"},
        {e:"🍝",l:"A mano",cu:"Italian",u:"https://booky.ph/biz/sundays-cafe-and-restaurant-diliman/menu/",p:"₱500–2000",pl:"Shangri-la",k:1,c:"#d9f2d9"}
      ] },
    { desc: "The journey is long! Pick a movie you’d like to watch to help you relax and pass the time on your journey!",
      cart: 3, line: "782. (Aly Arididon) aanhin ang seven wonders of the world kung ndi ikaw c aly",
      items: [
        {e:"🐋",l:"Whalefall",g:"Survival, Thriller",ratingUrl:"https://www.imdb.com/title/tt28535715/",syn:"Jay Gardiner dives off the coast of California to find his late father's remains and gets swallowed whole by a massive whale, leading to a desperate race against his dwindling oxygen supply.",c:"#cfe6ff"},
        {e:"🪆",l:"Other Mommy",g:"Supernatural, Horror",ratingUrl:"https://www.imdb.com/title/tt36586020/",syn:"An 8-year-old girl named Bela, living in a household with marital problems, faces a sinister entity coming out of her closet that threatens her and her family.",c:"#ffd9e8"},
        {e:"🎭",l:"Clayface",g:"Horror, Drama",ratingUrl:"https://www.imdb.com/title/tt34890576/",syn:"Matt Hagen rises from a Gotham street kid to a Hollywood star before a crime boss disfigures him. He undergoes a cutting-edge treatment that restores him but shatters his grip on reality.",c:"#e6d6ff"},
        {e:"🔄",l:"The Cycle",g:"Horror, Thriller",ratingUrl:"https://www.imdb.com/title/tt32358390/",syn:"Forensic anthropologist Meg investigates a brutal crime scene and discovers that one of the victims is her own father, who vanished 36 years prior.",c:"#ffe3b3"},
        {e:"🚪",l:"Backrooms",g:"Psychological Horror",ratingUrl:"https://www.imdb.com/title/tt26657236/",syn:"A strange doorway in a furniture showroom basement opens into an endless labyrinth of rooms where time bends and something lurks in the shadows.",c:"#d9f2d9"}
      ] },
    { desc: "One last stop! Oh what? A surprise? Don’t mind if I do.",
      cart: 4, line: "My favorite things in life are like that choco ice cream, but ure the chocolate at the end of the cone",
      items: [{e:"🎁",l:"Grand Surprise",g:1}] }
  ]
};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hat = (a, b) => '<svg viewBox="0 0 100 110"><polygon points="50,10 10,102 90,102" fill="' + a + '" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><polygon points="50,10 33,50 67,50" fill="' + b + '"/><circle cx="40" cy="78" r="5" fill="#fff"/><circle cx="62" cy="84" r="5" fill="#ffe0ec"/><circle cx="50" cy="66" r="4" fill="#fff"/><circle cx="50" cy="9" r="9" fill="#fff"/></svg>';
const HAT = hat("#ff9cc2", "#ff4d85"), HATB = hat("#8cc4ff", "#2f7bff");
const CAKE = '<svg viewBox="0 0 100 120"><g stroke="#fff" stroke-width="2.5"><rect x="26" y="24" width="8" height="24" rx="2" fill="#ff9cc2"/><rect x="46" y="24" width="8" height="24" rx="2" fill="#ff7aa9"/><rect x="66" y="24" width="8" height="24" rx="2" fill="#ff9cc2"/></g><g fill="#ffd24d"><ellipse cx="30" cy="16" rx="5" ry="8"/><ellipse cx="50" cy="16" rx="5" ry="8"/><ellipse cx="70" cy="16" rx="5" ry="8"/></g><rect x="14" y="46" width="72" height="26" rx="8" fill="#ff8fb8" stroke="#fff" stroke-width="3"/><path d="M14 50h72v6q-9 14-18 0q-9 14-18 0q-9 14-18 0z" fill="#fff"/><rect x="4" y="72" width="92" height="30" rx="9" fill="#ff5c93" stroke="#fff" stroke-width="3"/><circle cx="24" cy="88" r="3" fill="#fff"/><circle cx="50" cy="92" r="3" fill="#fff"/><circle cx="76" cy="88" r="3" fill="#fff"/><ellipse cx="50" cy="106" rx="48" ry="8" fill="#ffd1e3" stroke="#fff" stroke-width="2"/></svg>';
const GIFT = '<svg viewBox="0 0 120 120"><rect x="14" y="54" width="92" height="58" rx="8" fill="#ff8fb8" stroke="#fff" stroke-width="4"/><rect x="8" y="38" width="104" height="26" rx="8" fill="#ff5c93" stroke="#fff" stroke-width="4"/><rect x="52" y="38" width="16" height="74" fill="#fff"/><path d="M60 38C30 4 8 30 40 38ZM60 38C90 4 112 30 80 38Z" fill="#fff" stroke="#ff8fb8" stroke-width="3"/></svg>';
const picks = [];
let busy = false, tx = "-130vw";
$("ck1").innerHTML = CAKE; $("ck2").innerHTML = CAKE;

function head(fs, me){
  const h = document.createElement("div"); h.className = "head"; h.style.fontSize = fs + "px";
  const f = CONFIG.face;
  h.innerHTML = me
    ? '<div class="face"><span>🙂</span><img alt="" src="' + CONFIG.myPhoto + '" onerror="this.remove()" style="width:100%;height:100%;object-fit:cover;left:0;top:0"></div>' + HATB
    : '<div class="face"><span>🙂</span><img alt="" src="' + CONFIG.photos[1] + '" onerror="this.remove()" style="width:' + f.zoom + 'em;left:' + f.left + 'em;top:' + f.top + 'em"></div>' + HAT;
  return h;
}

// Page 1 Setup
$("ttl").textContent = CONFIG.title;
[["l",0],["m",1],["r",2]].forEach(([c, i]) => {
  const d = document.createElement("div"); d.className = "cut " + c;
  d.innerHTML = '<img alt="Aly" src="' + CONFIG.photos[i] + '"><span class="fb">💁‍♀️</span>';
  d.firstChild.onerror = function(){ this.remove(); d.querySelector(".fb").style.display = "block"; };
  if (c === "m") d.insertAdjacentHTML("beforeend", '<button class="hatb" id="hat" style="left:' + CONFIG.hat.left + (CONFIG.hat.top ? ";top:" + CONFIG.hat.top : "") + '">' + HAT + '<em>Click me!</em></button>');
  $("p1").appendChild(d);
});

// Train construction
const train = $("train");
let tr = "";
for (let i = 4; i >= 2; i--) tr += '<div class="cart" id="c' + i + '"><div class="bx">' + i + '</div><div class="load" id="ld' + i + '"></div><i class="w" style="left:14%"></i><i class="w" style="right:14%"></i></div>';
tr += '<div class="loco" id="c1"><div class="ch" id="ch"></div><div class="cab"></div><div class="bd"></div><div class="gs" id="gs"></div><i class="w" style="left:6%"></i><i class="w" style="left:40%"></i><i class="w" style="right:8%"></i></div>';
train.innerHTML = tr;
const FS = Math.round($("c1").offsetWidth / 1.45 * .85);
$("gs").style.width = $("gs").style.height = FS + "px";
const ghead = head(FS); $("gs").appendChild(ghead);

// "DRAG THE OPTIONS!" prompt bubble on Aly's train head
const dragPrompt = document.createElement("div");
dragPrompt.className = "drag-prompt-bub";
dragPrompt.id = "drag-prompt";
dragPrompt.textContent = "DRAG THE OPTIONS!";
$("gs").appendChild(dragPrompt);

const setX = v => { tx = v; train.style.setProperty("--x", v); };
setX("-130vw");

// Stop Counter Navigation
const ST = ["r","r","r","r","r","r"]; let cur = 1;
$("row").innerHTML = ST.map((_, i) => (i ? '<b class="ln"></b>' : "") + '<i class="st"></i>').join("");
const cs = [...document.querySelectorAll(".st")];
function paint(){
  cs.forEach((c, i) => { c.dataset.s = ST[i]; c.classList.toggle("blink", i === cur - 1 && ST[i] === "y"); });
  const c = cs[cur - 1]; $("here").style.left = (c.offsetLeft + c.offsetWidth / 2 - 7) + "px";
}
function enter(n){ cur = n; ST.forEach((_, i) => ST[i] = i < n - 1 ? "g" : i === n - 1 ? "y" : "r"); paint(); }
cs.forEach((c, i) => c.onclick = () => { if (!busy && ST[i] === "g") goto(i + 1); });
enter(1);

// Smooth Transition from Page 1
async function startJourney(){
  if (busy) return; busy = true;
  const hb = $("hat"), r = hb.getBoundingClientRect();
  const fh = head(120); fh.classList.add("fly");
  fh.style.left = (r.left + r.width/2 - 60) + "px"; fh.style.top = (r.bottom - 25) + "px";
  document.body.appendChild(fh); hb.style.display = "none";
  ST[0] = "g"; paint();
  $("p1").classList.add("out"); $("rail").classList.add("on");
  await sleep(700);
  train.style.transition = ""; setX("0px"); await sleep(2100);
  const s = $("gs").getBoundingClientRect();
  fh.style.left = s.left + "px"; fh.style.top = s.top + "px"; fh.style.transform = "scale(" + (s.width / 120) + ")";
  await sleep(1000);
  ghead.classList.add("on"); fh.remove(); $("p1").style.display = "none";
  await sleep(500);
  stage(0);
}
$("hat").onclick = startJourney;

// Drag Helper Functions
function hit(x, y, t){
  const r = t.getBoundingClientRect(), m = 24;
  return x > r.left - m && x < r.right + m && y > r.top - m && y < r.bottom + m;
}
function dragBoxes(items, target, onHit){
  document.querySelectorAll(".want").forEach(e => e.classList.remove("want"));
  const tray = $("tray"); tray.innerHTML = ""; tray.className = "tray n" + items.length; tray.scrollTop = 0; target.classList.add("want");
  items.forEach(it => {
    const b = document.createElement("div"); b.className = "box " + (it.g && !it.syn ? "gift" : it.syn ? "mv" : it.u ? "food" : "big"); if (it.c) b.style.background = it.c;
    b.innerHTML = it.syn ? '<div class="top2"><div class="nm">' + it.l + ' <small>(' + it.g + ')</small></div><div class="hd">☰ Drag</div></div><div>' + it.syn + '</div><div class="rating-row"><b>Ratings:</b> <a class="rating-link" href="' + it.ratingUrl + '" target="_blank" rel="noopener">IMDb</a></div>'
      : it.g ? GIFT : it.u
      ? '<div class="nm">' + it.l + ' <small>(' + it.cu + ')</small></div><div>Price: ' + it.p + '</div><div class="mn"><a href="' + it.u + '" target="_blank" rel="noopener">Menu</a><span class="ck ' + (it.k ? "ok" : "no") + '">Has chicken? ' + (it.k ? "✔" : "✘") + '</span></div>'
      : "<span>" + it.e + "</span><small>" + it.l + "</small>";
    
    let sx, sy, lx, ly, on = false, g;
    b.onpointerdown = e => {
      if (e.target.closest("a")) return;
      on = true; sx = lx = e.clientX; sy = ly = e.clientY; b.setPointerCapture(e.pointerId);
      const r = b.getBoundingClientRect(); g = b.cloneNode(true); g.classList.add("lift");
      g.style.cssText = "position:fixed;left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px;margin:0;pointer-events:none;background:" + (it.c || "none");
      document.body.appendChild(g); b.style.opacity = .2;
    };
    b.onpointermove = e => { if (!on) return; lx = e.clientX; ly = e.clientY; g.style.transform = "translate(" + (lx - sx) + "px," + (ly - sy) + "px) scale(1.04)"; target.classList.toggle("hot", hit(lx, ly, target)); };
    b.onpointerup = () => {
      if (!on) return; on = false; target.classList.remove("hot");
      if (hit(lx, ly, target)) { g.remove(); target.classList.remove("want"); tray.innerHTML = ""; onHit(it); }
      else { g.style.transition = "transform .3s"; g.style.transform = ""; setTimeout(() => { g.remove(); b.style.opacity = ""; }, 300); }
    };
    tray.appendChild(b);
  });
}

// Animation and Train Smoke
const ui = $("ui");
async function slideIn(){
  ui.style.transition = "none"; ui.className = ""; void ui.offsetWidth; ui.style.transition = "";
  ui.classList.add("in"); train.classList.add("chug"); await sleep(1600); train.classList.remove("chug");
}
async function slideOut(){
  ui.classList.remove("in"); ui.classList.add("out"); train.classList.add("chug"); await sleep(1600); train.classList.remove("chug");
}
function puff(){
  const r = $("ch").getBoundingClientRect(), e = document.createElement("div"), z = 12 + Math.random() * 10;
  e.className = "puff"; e.style.width = e.style.height = z + "px";
  e.style.left = (r.left + r.width/2 - z/2) + "px"; e.style.top = (r.top - z) + "px";
  e.style.setProperty("--dx", (-20 - Math.random() * 40) + "px"); e.style.setProperty("--dy", (-40 - Math.random() * 40) + "px"); e.style.setProperty("--sc", 2 + Math.random() * 1.5);
  document.body.appendChild(e); setTimeout(() => e.remove(), 2000);
}
function showBubble(t){
  const b = $("bub"), r = $("gs").getBoundingClientRect(), cx = r.left + r.width / 2, edge = Math.min(innerWidth - 6, cx + 44);
  b.textContent = t; b.style.right = (innerWidth - edge) + "px"; b.style.setProperty("--tr", (edge - cx - 10) + "px");
  b.style.bottom = (innerHeight - r.top + FS * .8 + 16) + "px"; b.classList.add("on");
}

// Stages 0, 1, 2 (Pages 2, 3, 4)
async function stage(i){
  const s = CONFIG.stops[i];
  enter(i + 2); $("dc").textContent = s.desc;
  
  $("drag-prompt").classList.add("show");

  dragBoxes(s.items, $("c" + s.cart), async it => {
    busy = true; picks[i] = it; $("ld" + s.cart).textContent = it.e; ST[i + 1] = "g"; paint();
    showBubble(s.line); train.classList.add("chug"); const iv = setInterval(puff, 450);
    await sleep(3600); clearInterval(iv); train.classList.remove("chug"); $("bub").classList.remove("on");
    await slideOut();
    if (i < 2) stage(i + 1); else scene();
  });
  await slideIn(); busy = false;
}

function fly(em, from, to){
  return new Promise(res => {
    const e = document.createElement("div"); e.className = "fx2"; e.textContent = em;
    e.style.left = (from.left + from.width / 2 - 20) + "px"; e.style.top = from.top + "px"; document.body.appendChild(e); void e.offsetWidth;
    e.style.left = (to.left + to.width / 2 - 20) + "px"; e.style.top = (to.top + to.height / 2 - 20) + "px";
    setTimeout(() => { e.remove(); res(); }, 950);
  });
}
async function deliver(cart, target, done){
  const ld = $("ld" + cart), em = ld.textContent, r = ld.getBoundingClientRect();
  ld.textContent = ""; await fly(em, r, target.getBoundingClientRect()); done();
}

// Circle Navigation Logic
async function goto(n){
  if (busy) return; busy = true; $("bub").classList.remove("on");
  document.querySelectorAll(".want").forEach(e => e.classList.remove("want"));
  if (ui.classList.contains("in")) await slideOut();
  $("scene").classList.remove("on"); $("end").classList.remove("on");
  for (let j = Math.max(0, n - 2); j < 3; j++) { picks[j] = undefined; $("ld" + (j + 2)).textContent = ""; }
  
  if (n === 1) {
    $("drag-prompt").classList.remove("show");
    enter(1); ghead.classList.remove("on"); $("rail").classList.remove("on"); train.style.setProperty("--sc", "1"); train.style.transition = ""; setX("-130vw");
    $("p1").style.display = ""; $("p1").classList.remove("out"); $("hat").style.display = "";
    document.querySelectorAll("#p1 .cut,#hat").forEach(el => { el.style.animation = "none"; void el.offsetWidth; el.style.animation = ""; });
    await sleep(2000); busy = false; return;
  }
  $("rail").classList.add("on"); ghead.classList.add("on");
  if (tx !== "0px" || (train.style.getPropertyValue("--sc") || "1") !== "1") { train.style.transition = "none"; train.style.setProperty("--sc", "1"); setX("-130vw"); void train.offsetWidth; train.style.transition = ""; setX("0px"); await sleep(2000); }
  if (n <= 4) stage(n - 2); else scene();
}
